<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Victoria y Cataleya</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050010; /* Fondo espacio profundo */
      color: #fff;
      font-family: 'Times New Roman', Times, serif; /* Fuente más elegante */
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="galaxyCanvas"></canvas>

<script>
  const canvas = document.getElementById('galaxyCanvas');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // ESTA ES LA LISTA MODIFICADA CON LOS NOMBRES
  const words = ["Victoria", "Cataleya", "Victoria & Cataleya", "Amor eterno", "Victoria", "Cataleya", "Te amo", "Eternidad", "Corazón", "Inspiración", "Magia"];
  
  const particles = [];

  // Crear partículas
  for (let i = 0; i < 150; i++) {
    particles.push({
      text: words[Math.floor(Math.random() * words.length)],
      angle: Math.random() * Math.PI * 2,
      radius: Math.random() * (canvas.width / 2.5) + 50,
      speed: (Math.random() * 0.004) + 0.001, // Velocidad variable
      size: Math.floor(Math.random() * 10) + 14 // Tamaño variable
    });
  }

  function animate() {
    // Efecto de rastro (motion blur)
    ctx.fillStyle = 'rgba(5, 0, 16, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    particles.forEach(p => {
      p.angle += p.speed;
      const x = centerX + Math.cos(p.angle) * p.radius;
      const y = centerY + Math.sin(p.angle) * (p.radius * 0.6); // Órbita elíptica

      // Estilo de texto: Color fucsia/rosado
      ctx.fillStyle = '#ff1493'; 
      ctx.font = `${p.size}px serif`;
      ctx.fillText(p.text, x, y);
    });

    requestAnimationFrame(animate);
  }

  animate();

  // Ajustar tamaño si se rota el teléfono
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
