<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Amor</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020008;
      font-family: 'Arial', sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      /* Fondo con degradado morado de galaxia */
      background: radial-gradient(circle, rgba(60,10,100,0.6) 0%, rgba(2,0,8,1) 80%);
    }
    .text-particle {
      position: absolute;
      white-space: nowrap;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.9), 0 0 15px rgba(255, 255, 255, 0.6);
      z-index: 10;
      transform-origin: center center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<script>
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 15);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  // --- FONDO DE GALAXIA CON POLVO ESTELAR ---
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 2000;
  const starPositions = new Float32Array(starsCount * 3);

  for(let i = 0; i < starsCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 120;
  }
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

  const starsMaterial = new THREE.PointsMaterial({
    color: 0xcc88ff,
    size: 0.18,
    transparent: true,
    opacity: 0.8
  });
  const starField = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(starField);

  // --- CORAZÓN ROJO EN EL CENTRO ---
  const heartShape = new THREE.Shape();
  heartShape.moveTo(0, 0);
  heartShape.bezierCurveTo(0, -0.3, -0.6, -0.3, -0.6, 0);
  heartShape.bezierCurveTo(-0.6, 0.6, 0, 1, 0, 1.4);
  heartShape.bezierCurveTo(0, 1, 0.6, 0.6, 0.6, 0);
  heartShape.bezierCurveTo(0.6, -0.3, 0, -0.3, 0, 0);

  const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.4, bevelEnabled: true, bevelSize: 0.1, bevelThickness: 0.1 });
  heartGeo.center();
  const heartMat = new THREE.MeshPhongMaterial({ color: 0xff0022, shininess: 100 });
  const heart = new THREE.Mesh(heartGeo, heartMat);
  heart.rotation.x = Math.PI;
  heart.scale.set(2.8, 2.8, 2.8);
  scene.add(heart);

  // Luces
  const light = new THREE.PointLight(0xffffff, 2, 100);
  light.position.set(2, 5, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x553377));

  // --- FRASES FORMANDO EL ANILLO EN ÓRBITA ---
  const phrases = [
    "Clarissa", "Victoria", "te amo", "mi vida", 
    "me quedaría contigo mil años", "una vida entera contigo", 
    "preciosas", "princesas", "mis amores", "amor"
  ];

  const particles = [];
  const textCount = 90; // Cantidad para que cree el anillo visible continuo
  
  // Creamos un pivote en el centro para rotar toda la galaxia de texto
  const textGroupPivot = new THREE.Group();
  scene.add(textGroupPivot);

  for (let i = 0; i < textCount; i++) {
    const div = document.createElement('div');
    div.className = 'text-particle';
    div.innerText = phrases[i % phrases.length];
    container.appendChild(div);

    // Distribuir en un anillo alrededor del centro (radio uniforme)
    const angle = (i / textCount) * Math.PI * 2;
    const radius = 4.5 + Math.random() * 2.5; // Distancia justa al corazón
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius * 0.4; // Ligeramente inclinado
    const z = (Math.random() - 0.5) * 3;

    particles.push({
      el: div,
      pos: new THREE.Vector3(x, y, z),
      angle: angle,
      radius: radius
    });
  }

  // --- ANIMACIÓN ---
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.008;

    // Latido y rotación del corazón
    heart.rotation.y = Math.sin(time) * 0.3;
    heart.position.y = Math.sin(time * 2) * 0.15;

    starField.rotation.y += 0.0005;

    const w2 = window.innerWidth / 2;
    const h2 = window.innerHeight / 2;

    // Mover y proyectar cada texto alrededor del corazón
    particles.forEach((p, idx) => {
      // Rotar individualmente el ángulo
      const currentAngle = p.angle + time * 0.4;
      
      const x = Math.cos(currentAngle) * p.radius;
      const z = Math.sin(currentAngle) * p.radius;
      const y = Math.sin(currentAngle * 2) * 0.8; 

      const worldPos = new THREE.Vector3(x, y, z);
      
      // Mapear a la pantalla 2D
      const proj = worldPos.clone().project(camera);
      const screenX = proj.x * w2 + w2;
      const screenY = -(proj.y * h2) + h2;

      p.el.style.transform = `translate(-50%, -50%) translate3d(${screenX}px, ${screenY}px, 0px)`;
      
      // Tamaño y transparencia según la profundidad (Z)
      const scale = (z + 10) / 15;
      p.el.style.fontSize = `${10 * scale}px`;
      p.el.style.opacity = Math.max(0.2, (z + 8) / 16);
      p.el.style.color = z > 0 ? "#ffffff" : "#ff88cc";
    });

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
