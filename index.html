<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Amor - Victoria, Clarissa y Cataleya</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #020008; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
        }
        .text-particle {
            position: absolute;
            white-space: nowrap;
            font-weight: 700;
            pointer-events: none;
            transition: color 1.2s ease-in-out;
            text-shadow: 0 0 8px rgba(255, 20, 147, 0.8), 0 0 15px rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<script>
    // --- ESCENA Y CÁMARA ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // --- FONDO DE GALAXIA MORADA Y AZUL ---
    const starCount = 2500;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);

    // Colores de la galaxia: azul, morado, violeta y blanco
    const galaxyColors = [
        new THREE.Color(0x4b0082), // Índigo/Morado
        new THREE.Color(0x8a2be2), // Azul Violeta
        new THREE.Color(0x00bfff), // Azul Profundo
        new THREE.Color(0xda70d6), // Orquídea
        new THREE.Color(0xffffff)  # Blanco estrella
    ];

    for (let i = 0; i < starCount; i++) {
        starPositions[i * 3] = (Math.random() - 0.5) * 120;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 120;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 120;

        const col = galaxyColors[Math.floor(Math.random() * galaxyColors.length)];
        starColors[i * 3] = col.r;
        starColors[i * 3 + 1] = col.g;
        starColors[i * 3 + 2] = col.b;
    }

    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

    const starMaterial = new THREE.PointsMaterial({
        size: 0.25,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
    });
    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    // --- CORAZÓN ROJO Y MEJOR HECHO ---
    const heartShape = new THREE.Shape();
    const x = 0, y = 0;
    heartShape.moveTo(x + 0.25, y + 0.25);
    heartShape.bezierCurveTo(x + 0.25, y + 0.25, x, y, x, y - 0.25);
    heartShape.bezierCurveTo(x, y - 0.75, x - 0.75, y - 0.75, x - 0.75, y - 0.75);
    heartShape.bezierCurveTo(x - 1.25, y - 0.75, x - 1.25, y - 0.125, x - 1.25, y - 0.125);
    heartShape.bezierCurveTo(x - 1.25, y + 0.375, x - 0.5, y + 0.875, x + 0.25, y + 1.25);
    heartShape.bezierCurveTo(x + 1, y + 0.875, x + 1.75, y + 0.375, x + 1.75, y - 0.125);
    heartShape.bezierCurveTo(x + 1.75, y - 0.125, x + 1.75, y - 0.75, x + 1.25, y - 0.75);
    heartShape.bezierCurveTo(x + 0.875, y - 0.75, x + 0.25, y, x + 0.25, y + 0.25);

    const extrudeSettings = { 
        depth: 0.5, 
        bevelEnabled: true, 
        bevelSegments: 5, 
        steps: 3, 
        bevelSize: 0.2, 
        bevelThickness: 0.2 
    };
    const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
    heartGeo.center();

    // Material rojo brillante radiante
    const heartMat = new THREE.MeshPhongMaterial({ 
        color: 0xff0033, 
        emissive: 0x660011, 
        shininess: 120, 
        specular: 0xffaaaa 
    });
    const heart = new THREE.Mesh(heartGeo, heartMat);
    heart.scale.set(2.2, 2.2, 2.2); // Tamaño destacado en el centro
    heart.rotation.x = Math.PI;
    scene.add(heart);

    // Luces para resaltar el corazón rojo
    const redLight = new THREE.PointLight(0xff0044, 3, 40);
    redLight.position.set(0, 0, 8);
    scene.add(redLight);

    const blueGlow = new THREE.PointLight(0x8a2be2, 2, 50);
    blueGlow.position.set(-10, 10, -5);
    scene.add(blueGlow);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // --- ESTRELLA FUGAZ PASANDO CERCA ---
    const shootingStarGeo = new THREE.BufferGeometry();
    const shootingStarPos = new Float32Array(3);
    shootingStarGeo.setAttribute('position', new THREE.BufferAttribute(shootingStarPos, 3));
    const shootingStarMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, transparent: true, blending: THREE.AdditiveBlending });
    const shootingStar = new THREE.Points(shootingStarGeo, shootingStarMat);
    scene.add(shootingStar);

    let isShooting = false;
    let shootVel = new THREE.Vector3();

    function triggerShootingStar() {
        isShooting = true;
        // Pasa cruzando cerca del corazón
        shootingStar.position.set(-12, 6, 2);
        shootVel.set(0.6, -0.3, -0.1);
        setTimeout(() => { isShooting = false; }, 1800);
    }
    setInterval(() => { if(!isShooting) triggerShootingStar(); }, 3500);

    // --- 100 FRASES GIRANDO ALREDEDOR DEL CORAZÓN ---
    const basePhrases = [
        "amor", "mi vida", "te amo", "una vida entera contigo", 
        "me quedaría contigo mil años", "princesas", "mis amores", 
        "Clarissa", "Victoria", "preciosas"
    ];

    const totalPhrasesCount = 100;
    const textParticles = [];

    for (let i = 0; i < totalPhrasesCount; i++) {
        const txt = basePhrases[i % basePhrases.length];
        const el = document.createElement('div');
        el.className = 'text-particle';
        el.innerText = txt;
        container.appendChild(el);

        textParticles.push({
            element: el,
            angle: Math.random() * Math.PI * 2,
            radius: 4.2 + Math.random() * 4.5, // Órbita cercana al corazón
            speed: (0.003 + Math.random() * 0.004) * (Math.random() < 0.5 ? 1 : -1),
            yOff: (Math.random() - 0.5) * 5,
            phase: Math.random() * Math.PI * 2,
            baseSize: 11 + Math.floor(Math.random() * 6)
        });
    }

    // --- ANIMACIÓN ---
    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0012;

        // Rotación y latido suave del corazón
        heart.rotation.y += 0.012;
        const pulse = 2.2 + Math.sin(time * 3) * 0.08;
        heart.scale.set(pulse, pulse, pulse);

        // Movimiento de estrella fugaz
        if (isShooting) {
            shootingStar.position.add(shootVel);
            shootingStar.material.opacity = Math.sin(time * 12);
        } else {
            shootingStar.position.set(100, 100, 100);
        }

        // Rotación de la galaxia
        starField.rotation.y += 0.0006;
        starField.rotation.x += 0.0002;

        // Actualización de las 100 frases
        const widthHalf = window.innerWidth / 2;
        const heightHalf = window.innerHeight / 2;

        textParticles.forEach(p => {
            p.angle += p.speed;
            const x = Math.cos(p.angle) * p.radius;
            const z = Math.sin(p.angle) * p.radius;
            const y = p.yOff + Math.sin(p.angle * 2 + p.phase) * 0.8;

            const vector = new THREE.Vector3(x, y, z);
            vector.project(camera);

            const sx = (vector.x * widthHalf) + widthHalf;
            const sy = -(vector.y * heightHalf) + heightHalf;

            p.element.style.transform = `translate(-50%, -50%) translate3d(${sx}px, ${sy}px, 0)`;
            
            // Tamaño según cercanía (3D)
            const depthScale = Math.max(0.6, (z + 10) / 15);
            p.element.style.fontSize = `${p.baseSize * depthScale}px`;
            
            // Opacidad
            p.element.style.opacity = Math.max(0.2, (z + 10) / 16);

            // Cambio progresivo de blanco a rosa
            const colorBlend = Math.sin(time * 2 + p.phase);
            p.element.style.color = colorBlend > 0 ? "#ffffff" : "#ff69b4";
        });

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
