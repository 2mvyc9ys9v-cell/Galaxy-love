<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Amor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(ellipse at center, #1a0033 0%, #08001a 60%, #020005 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .text-particle {
      position: absolute;
      white-space: nowrap;
      font-weight: 700;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.9), 0 0 16px rgba(255, 255, 255, 0.8);
      transform: translate(-50%, -50%);
      color: #ffffff;
      user-select: none;
      letter-spacing: 0.5px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<script>
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 16;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // --- ESTRELLAS BLANCAS Y FINAS (EFECTO ESPACIO REAL) ---
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 2000;
  const starPositions = new Float32Array(starsCount * 3);
  const starScales = new Float32Array(starsCount);

  for(let i = 0; i < starsCount; i++) {
    starPositions[i * 3] = (Math.random() - 0.5) * 120;
    starPositions[i * 3 + 1] = (Math.random() - 0.5) * 120;
    starPositions[i * 3 + 2] = (Math.random() - 0.5) * 120;
    starScales[i] = Math.random();
  }
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

  const starsMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.1,
    transparent: true,
    opacity: 0.85
  });
  const starField = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(starField);

  // --- ESTRELLAS FUGACES ---
  const shootingStars = [];
  function createShootingStar() {
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(6);
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.9
    });

    const line = new THREE.Line(geometry, material);
    scene.add(line);

    return {
      line: line,
      x: 10 + Math.random() * 15,
      y: 10 + Math.random() * 10,
      z: (Math.random() - 0.5) * 10,
      speed: 0.35 + Math.random() * 0.25,
      length: 3 + Math.random() * 2
    };
  }

  for(let i = 0; i < 3; i++) {
    shootingStars.push(createShootingStar());
  }

  // --- CORAZÓN ROJO RUBÍ BONITO EN 3D ---
  const heartShape = new THREE.Shape();
  const x = 0, y = 0;
  heartShape.moveTo(x + 0.25, y + 0.25);
  heartShape.bezierCurveTo(x + 0.25, y + 0.25, x, y, x - 0.25, y);
  heartShape.bezierCurveTo(x - 0.55, y, x - 0.55, y + 0.35, x - 0.55, y + 0.35);
  heartShape.bezierCurveTo(x - 0.55, y + 0.55, x - 0.35, y + 0.77, x, y + 0.95);
  heartShape.bezierCurveTo(x + 0.35, y + 0.77, x + 0.55, y + 0.55, x + 0.55, y + 0.35);
  heartShape.bezierCurveTo(x + 0.55, y + 0.35, x + 0.55, y, x + 0.25, y);

  const extrudeSettings = {
    depth: 0.25,
    bevelEnabled: true,
    bevelSegments: 5,
    steps: 2,
    bevelSize: 0.08,
    bevelThickness: 0.08
  };

  const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
  heartGeo.center();

  // Material Rojo Carmesí con brillo elegante
  const heartMat = new THREE.MeshPhongMaterial({
    color: 0xd90429,
    emissive: 0x50000a,
    specular: 0xffffff,
    shininess: 100
  });

  const heart = new THREE.Mesh(heartGeo, heartMat);
  heart.rotation.x = Math.PI;
  heart.scale.set(3.5, 3.5, 3.5);
  scene.add(heart);

  // Luces profesionales
  const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
  mainLight.position.set(5, 5, 10);
  scene.add(mainLight);

  const redGlow = new THREE.PointLight(0xff0044, 2, 20);
  redGlow.position.set(0, 0, 3);
  scene.add(redGlow);

  scene.add(new THREE.AmbientLight(0x331122));

  // --- FRASES SEPARADAS CON MOVIMIENTO DE ARRIBA A ABAJO ---
  const phrases = [
    "Clarissa", "Victoria", "Te amo", "Mi vida", 
    "Me quedaría contigo mil años", "Una vida entera contigo", 
    "Preciosas", "Princesas", "Mis amores", "Amor"
  ];

  const textParticles = [];
  const textCount = 50; 
  const radius = 6.8; // Radio más amplio para que NO tapen el corazón

  for (let i = 0; i < textCount; i++) {
    const div = document.createElement('div');
    div.className = 'text-particle';
    div.innerText = phrases[i % phrases.length];
    container.appendChild(div);

    const angle = (i / textCount) * Math.PI * 2;

    textParticles.push({
      el: div,
      angle: angle,
      speed: 0.005, // Velocidad suave
      offsetY: Math.sin(i) * 2 // Variación de altura inicial
    });
  }

  // --- ANIMACIÓN ---
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.015;

    // Latido suave y rotación elegatne del corazón
    const pulse = 1 + Math.sin(time * 2.5) * 0.05;
    heart.scale.set(3.5 * pulse, 3.5 * pulse, 3.5 * pulse);
    heart.rotation.y = Math.sin(time * 0.8) * 0.2;

    // Fondo de estrellas girando lentamente
    starField.rotation.y += 0.0002;

    // Estrellas fugaces reales
    shootingStars.forEach(st => {
      st.x -= st.speed;
      st.y -= st.speed * 0.6;

      const pos = st.line.geometry.attributes.position.array;
      pos[0] = st.x;
      pos[1] = st.y;
      pos[2] = st.z;
      pos[3] = st.x + st.length;
      pos[4] = st.y + (st.length * 0.6);
      pos[5] = st.z;
      st.line.geometry.attributes.position.needsUpdate = true;

      if (st.y < -15 || st.x < -20) {
        st.x = 15 + Math.random() * 10;
        st.y = 12 + Math.random() * 10;
      }
    });

    // Anillo de texto flotante (Onda vertical + Órbita amplia)
    const w2 = window.innerWidth / 2;
    const h2 = window.innerHeight / 2;

    textParticles.forEach((p, idx) => {
      p.angle += p.speed;

      // Coordenadas con movimiento ondulante vertical (sube y baja)
      const x = Math.cos(p.angle) * radius;
      const z = Math.sin(p.angle) * radius;
      const y = Math.sin(time + idx * 0.5) * 1.8 + (Math.sin(p.angle) * 0.8);

      const worldPos = new THREE.Vector3(x, y, z);
      const proj = worldPos.clone().project(camera);

      const screenX = proj.x * w2 + w2;
      const screenY = -(proj.y * h2) + h2;

      p.el.style.left = `${screenX}px`;
      p.el.style.top = `${screenY}px`;

      // Tamaño y opacidad según profundidad (Z)
      const scale = (z + 18) / 22;
      const fontSize = Math.max(9, Math.min(17, 13 * scale));
      p.el.style.fontSize = `${fontSize}px`;

      const opacity = (z + radius) / (radius * 2);
      p.el.style.opacity = Math.max(0.2, Math.min(1, opacity));
      p.el.style.zIndex = z > 0 ? 20 : 5;
    });

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
