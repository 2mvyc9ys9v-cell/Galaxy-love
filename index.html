<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Amor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #2e0854 0%, #080010 70%, #000000 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Contenedor central donde todo se alinea perfectamente */
    .universe {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Corazón en el centro exacto */
    .heart {
      font-size: 80px;
      z-index: 10;
      filter: drop-shadow(0 0 20px #ff0055);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Anillo giratorio de palabras */
    .orbit {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Posicionamiento de cada palabra alrededor del corazón */
    .word {
      position: absolute;
      top: 50%;
      left: 50%;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      text-shadow: 0 0 8px #ff69b4, 0 0 12px #ff007f;
      transform-origin: 0 0;
    }
  </style>
</head>
<body>

  <div class="universe">
    <div class="heart">❤️</div>
    <div class="orbit" id="orbit"></div>
  </div>

  <script>
    const phrases = [
      "Clarissa", "Victoria", "Te amo", "Mi vida", 
      "Me quedaría contigo mil años", "Una vida entera contigo", 
      "Preciosas", "Princesas", "Mis amores", "Amor",
      "Clarissa", "Victoria", "Te amo", "Mi vida"
    ];

    const orbit = document.getElementById('orbit');
    const total = phrases.length;
    const radius = 110; // Distancia pegadita al corazón

    phrases.forEach((text, i) => {
      const el = document.createElement('div');
      el.className = 'word';
      el.innerText = text;

      // Cálculo en círculo perfecto
      const angle = (i / total) * (2 * Math.PI);
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;

      // Inclinación suave para acompañar la curva
      const rotationDeg = (angle * 180 / Math.PI) + 90;

      el.style.transform = `translate(${x}px, ${y}px) rotate(${rotationDeg}deg)`;
      orbit.appendChild(el);
    });
  </script>
</body>
</html>
