<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Amor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .text-particle {
      position: absolute;
      white-space: nowrap;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 105, 180, 1), 0 0 20px rgba(255, 255, 255, 0.9);
      transform: translate(-50%, -50%);
      color: #ffffff;
      user-select: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<script>
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 15;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // --- CREAR TEXTURA DE LUZ/POLVO PARA LA GALAXIA ---
  function createGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.3, 'rgba(180,80,255,0.6)');
    gradient.addColorStop(0.8, 'rgba(60,0,120,0.2)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }

  const particleTexture = createGlowTexture();

  // --- GALAXIA VIVA (NUBE DE NEBULOSA EN ESPIRAL) ---
  const nebulaGeometry = new THREE.BufferGeometry();
  const nebulaCount = 3000;
  const nebulaPositions = new Float32Array(nebulaCount * 3);
  const nebulaColors = new Float32Array(nebulaCount * 3);

  const colorPalette = [
    new THREE.Color(0x8a2be2), // Violeta
    new THREE.Color(0xff1493), // Rosa neón
    new THREE.Color(0x4169e1), // Azul real
    new THREE.Color(0x9370db)  // Púrpura suave
  ];

  for (let i = 0; i < nebulaCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.pow(Math.random(), 2) * 35 + 2; 
    const x = Math.cos(angle) * radius + (Math.random() - 0.5) * 5;
    const y = Math.sin(angle) * radius * 0.5 + (Math.random() - 0.5) * 5;
    const z = (Math.random() - 0.5) * 15 - 5;

    nebulaPositions[i * 3] = x;
    nebulaPositions[i * 3 + 1] = y;
    nebulaPositions[i * 3 + 2] = z;

    const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
    nebulaColors[i * 3] = color.r;
    nebulaColors[i * 3 + 1] = color.g;
    nebulaColors[i * 3 + 2] = color.b;
  }

  nebulaGeometry.setAttribute('position', new THREE.BufferAttribute(nebulaPositions, 3));
  nebulaGeometry.setAttribute('color', new THREE.BufferAttribute(nebulaColors, 3));

  const nebulaMaterial = new THREE.PointsMaterial({
    size: 0.8,
    map: particleTexture,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const nebula = new THREE.Points(nebulaGeometry, nebulaMaterial);
  scene.add(nebula);

  // --- ESTRELLAS BRILLANTES DE FONDO ---
  const starsGeometry = new THREE.BufferGeometry();
  const starsCount = 1200;
  const starPositions = new Float32Array(starsCount * 3);

  for(let i = 0; i < starsCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 100;
  }
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

  const starsMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.12,
    transparent: true,
    opacity: 0.9
  });
  const starField = new THREE.Points(starsGeometry, starsMaterial);
  scene.add(starField);

  // --- ESTRELLAS FUGACES ---
  const shootingStars = [];
  function createShootingStar() {
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(6);
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 1
    });

    const line = new THREE.Line(geometry, material);
    scene.add(line);

    return {
      line: line,
      x: (Math.random() - 0.5) * 30,
      y: 15 + Math.random() * 10,
      z: (Math.random() - 0.5) * 10,
      speed: 0.4 + Math.random() * 0.3,
      length: 2.5 + Math.random() * 2,
    };
  }

  for(let i = 0; i < 3; i++) {
    shootingStars.push(createShootingStar());
  }

  // --- CORAZÓN CENTRAL ---
  const heartShape = new THREE.Shape();
  heartShape.moveTo(0, 0);
  heartShape.bezierCurveTo(0, -0.3, -0.6, -0.3, -0.6, 0);
  heartShape.bezierCurveTo(-0.6, 0.6, 0, 1, 0, 1.4);
  heartShape.bezierCurveTo(0, 1, 0.6, 0.6, 0.6, 0);
  heartShape.bezierCurveTo(0.6, -0.3, 0, -0.3, 0, 0);

  const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.3, bevelEnabled: true, bevelSize: 0.1, bevelThickness: 0.1 });
  heartGeo.center();
  const heartMat = new THREE.MeshPhongMaterial({ color: 0xff0033, emissive: 0x660015, shininess: 90 });
  const heart = new THREE.Mesh(heartGeo, heartMat);
  heart.rotation.x = Math.PI;
  heart.scale.set(2.2, 2.2, 2.2);
  scene.add(heart);

  // Luces
  const light = new THREE.PointLight(0xff69b4, 2.5, 50);
  light.position.set(0, 0, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));

  // --- ANILLO CON 80 FRASES FLOTANDO ---
  const basePhrases = [
    "Clarissa", "Victoria", "Te amo", "Mi vida", 
    "Me quedaría contigo mil años", "Una vida entera contigo", 
    "Preciosas", "Princesas", "Mis amores", "Amor"
  ];

  const textParticles = [];
  const textCount = 80; // Se repite hasta tener 80 elementos en órbita
  const radius = 5.2;

  for (let i = 0; i < textCount; i++) {
    const div = document.createElement('div');
    div.className = 'text-particle';
    div.innerText = basePhrases[i % basePhrases.length];
    container.appendChild(div);

    const angle = (i / textCount) * Math.PI * 2;

    textParticles.push({
      el: div,
      angle: angle,
      speed: 0.007
    });
  }

  // --- ANIMACIÓN VIVA ---
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.01;

    // Rotación de la galaxia y estrellas
    nebula.rotation.z += 0.001;
    nebula.rotation.y = Math.sin(time * 0.5) * 0.1;
    starField.rotation.y += 0.0003;

    // Latido suave del corazón
    heart.position.y = Math.sin(time * 2) * 0.1;
    heart.rotation.y = Math.sin(time) * 0.15;

    // Estrellas fugaces
    shootingStars.forEach(st => {
      st.x -= st.speed;
      st.y -= st.speed * 0.7;

      const pos = st.line.geometry.attributes.position.array;
      pos[0] = st.x;
      pos[1] = st.y;
      pos[2] = st.z;
      pos[3] = st.x + st.length;
      pos[4] = st.y + (st.length * 0.7);
      pos[5] = st.z;
      st.line.geometry.attributes.position.needsUpdate = true;

      if (st.y < -15 || st.x < -20) {
        st.x = 10 + Math.random() * 15;
        st.y = 15 + Math.random() * 10;
      }
    });

    // Anillo de 80 textos flotando alrededor
    const w2 = window.innerWidth / 2;
    const h2 = window.innerHeight / 2;

    textParticles.forEach(p => {
      p.angle += p.speed;

      const x = Math.cos(p.angle) * radius;
      const z = Math.sin(p.angle) * radius;
      const y = Math.sin(p.angle) * 1.2;

      const worldPos = new THREE.Vector3(x, y, z);
      const proj = worldPos.clone().project(camera);

      const screenX = proj.x * w2 + w2;
      const screenY = -(proj.y * h2) + h2;

      p.el.style.left = `${screenX}px`;
      p.el.style.top = `${screenY}px`;

      const scale = (z + 15) / 20;
      const fontSize = Math.max(8, Math.min(16, 12 * scale));
      p.el.style.fontSize = `${fontSize}px`;

      const opacity = (z + radius) / (radius * 2);
      p.el.style.opacity = Math.max(0.2, Math.min(1, opacity));
      p.el.style.zIndex = z > 0 ? 20 : 5;
    });

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
