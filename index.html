<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Amor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #05021a;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>

<canvas id="galaxyCanvas"></canvas>

<script>
  const canvas = document.getElementById('galaxyCanvas');
  const ctx = canvas.getContext('2d');

  let width, height, centerX, centerY;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    centerX = width / 2;
    centerY = height / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // --- FRASES DE AMOR ---
  const phrases = [
    "Clarissa", "Victoria", "Te amo", "Mi vida", 
    "Me quedaría contigo mil años", "Una vida entera contigo", 
    "Preciosas", "Princesas", "Mis amores", "Amor"
  ];

  // Configuración de órbitas (distancias desde el corazón)
  const orbits = [
    { radius: 110, speed: 0.003, items: [] },
    { radius: 170, speed: -0.002, items: [] },
    { radius: 230, speed: 0.0015, items: [] }
  ];

  // Distribuir frases en las órbitas
  let phraseIdx = 0;
  orbits.forEach((orbit) => {
    const count = 12; // Frases por anillo
    for (let i = 0; i < count; i++) {
      orbit.items.push({
        text: phrases[phraseIdx % phrases.length],
        angle: (i / count) * Math.PI * 2
      });
      phraseIdx++;
    }
  });

  // --- ESTRELLAS DE FONDO Y PARTÍCULAS GLOW ---
  const stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.8 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    });
  }

  // Bolitas/partículas de luz (como las esferas rosa y violeta de tu foto)
  const glowOrbs = [];
  const colors = ['#ff2a75', '#b537ff', '#ff73b3', '#ffffff', '#8a2be2'];
  for (let i = 0; i < 25; i++) {
    glowOrbs.push({
      radius: Math.random() * 220 + 80,
      angle: Math.random() * Math.PI * 2,
      speed: (Math.random() - 0.5) * 0.004,
      size: Math.random() * 6 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      pulse: Math.random() * Math.PI
    });
  }

  // --- ESTRELLAS FUGACES ---
  const shootingStars = [];
  function addShootingStar() {
    shootingStars.push({
      x: Math.random() * width + 200,
      y: Math.random() * (height / 2),
      length: Math.random() * 80 + 50,
      speed: Math.random() * 8 + 6,
      alpha: 1
    });
  }
  setInterval(addShootingStar, 2500);

  // --- DIBUJAR CORAZÓN RESPLANDECIENTE (ESTILO FOTO) ---
  function drawHeart(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    
    // Resplandor Neón
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 35;
    
    ctx.beginPath();
    const topCurve = size * 0.3;
    ctx.moveTo(0, topCurve);
    ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurve);
    ctx.bezierCurveTo(-size / 2, (size + topCurve) / 2, 0, size, 0, size);
    ctx.bezierCurveTo(0, size, size / 2, (size + topCurve) / 2, size / 2, topCurve);
    ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurve);
    ctx.closePath();

    // Degradado Rosa/Magenta Radiante
    const grad = ctx.createLinearGradient(0, 0, 0, size);
    grad.addColorStop(0, '#ff66a3');
    grad.addColorStop(0.5, '#ff0055');
    grad.addColorStop(1, '#cc0044');
    
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }

  // --- BUCLE PRINCIPAL DE ANIMACIÓN ---
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.02;

    // Fondo degradado espacial
    const bgGrad = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, Math.max(width, height) / 1.2);
    bgGrad.addColorStop(0, '#1c0038');
    bgGrad.addColorStop(0.6, '#080119');
    bgGrad.addColorStop(1, '#020008');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    // 1. Dibujar Estrellas Blancas Brillando / Titilando
    stars.forEach(s => {
      s.alpha += Math.sin(time * s.speed * 10) * 0.015;
      ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.2, Math.min(1, s.alpha))})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });

    // 2. Dibujar Estrellas Fugaces
    shootingStars.forEach((ss, idx) => {
      ss.x -= ss.speed;
      ss.y += ss.speed * 0.5;
      ss.alpha -= 0.01;

      const grad = ctx.createLinearGradient(ss.x, ss.y, ss.x + ss.length, ss.y - ss.length * 0.5);
      grad.addColorStop(0, `rgba(255, 255, 255, ${ss.alpha})`);
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ss.x, ss.y);
      ctx.lineTo(ss.x + ss.length, ss.y - ss.length * 0.5);
      ctx.stroke();

      if (ss.alpha <= 0) shootingStars.splice(idx, 1);
    });

    // 3. Anillos de Órbita Sutiles (Líneas finas de guía)
    orbits.forEach(orbit => {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(centerX, centerY, orbit.radius, 0, Math.PI * 2);
      ctx.stroke();
    });

    // 4. Bolitas / Esferas Brillantes Flotando
    glowOrbs.forEach(orb => {
      orb.angle += orb.speed;
      const x = centerX + Math.cos(orb.angle) * orb.radius;
      const y = centerY + Math.sin(orb.angle) * orb.radius;

      ctx.save();
      ctx.shadowColor = orb.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = orb.color;
      ctx.beginPath();
      ctx.arc(x, y, orb.size + Math.sin(time + orb.pulse) * 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // 5. Corazón Central con Latido Neón
    const pulseScale = 45 + Math.sin(time * 2) * 3;
    drawHeart(centerX, centerY - pulseScale / 2, pulseScale);

    // 6. Texto Flotante Girando en Órbita
    ctx.font = 'bold 12px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    orbits.forEach(orbit => {
      orbit.items.forEach(item => {
        item.angle += orbit.speed;

        const x = centerX + Math.cos(item.angle) * orbit.radius;
        const y = centerY + Math.sin(item.angle) * orbit.radius;

        // Rotación leve de las letras hacia el centro para acompañar la curva
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(item.angle + Math.PI / 2);

        ctx.shadowColor = '#ff66cc';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(item.text, 0, 0);

        ctx.restore();
      });
    });
  }

  animate();
</script>
</body>
</html>
