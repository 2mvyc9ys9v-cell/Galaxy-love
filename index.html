<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Amor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05000a; font-family: 'Arial', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; background: radial-gradient(circle, #1a0033 0%, #05000a 100%); }
        .text-particle {
            position: absolute;
            white-space: nowrap;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<script>
    // 1. CONFIGURACIÓN BÁSICA
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. FONDO DE GALAXIA MORADA/AZUL
    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for (let i = 0; i < 2000; i++) {
        starCoords.push((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xaa00ff, size: 0.15, transparent: true });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // 3. CORAZÓN ROJO GRANDE
    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, 0);
    heartShape.bezierCurveTo(0, -0.3, -0.6, -0.3, -0.6, 0);
    heartShape.bezierCurveTo(-0.6, 0.6, 0, 1, 0, 1.4);
    heartShape.bezierCurveTo(0, 1, 0.6, 0.6, 0.6, 0);
    heartShape.bezierCurveTo(0.6, -0.3, 0, -0.3, 0, 0);

    const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.4, bevelEnabled: true, bevelSize: 0.1, bevelThickness: 0.1 });
    heartGeo.center();
    const heartMat = new THREE.MeshPhongMaterial({ color: 0xff0000, shininess: 100 });
    const heart = new THREE.Mesh(heartGeo, heartMat);
    heart.rotation.x = Math.PI;
    heart.scale.set(3, 3, 3); // Corazón más grande
    scene.add(heart);

    // Luces
    const light = new THREE.PointLight(0xffffff, 1.5, 100);
    light.position.set(0, 5, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // 4. ESTRELLA FUGAZ CERCA
    const shootGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0], 3));
    const shootMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true });
    const shootStar = new THREE.Points(shootGeo, shootMat);
    scene.add(shootStar);
    let shootActive = false;

    function triggerShoot() {
        shootActive = true;
        shootStar.position.set(-10, 5, 5);
        setTimeout(() => shootActive = false, 1500);
    }
    setInterval(triggerShoot, 4000);

    // 5. 100 FRASES RODEANDO EL CORAZÓN
    const phrases = ["amor", "mi vida", "te amo", "una vida entera contigo", "me quedaría contigo mil años", "princesas", "mis amores", "Clarissa", "Victoria", "preciosas"];
    const particles = [];
    const container = document.getElementById('canvas-container');

    for (let i = 0; i < 100; i++) {
        const div = document.createElement('div');
        div.className = 'text-particle';
        div.innerText = phrases[i % phrases.length];
        container.appendChild(div);

        particles.push({
            el: div,
            angle: Math.random() * Math.PI * 2,
            radius: 5 + Math.random() * 4, // Órbita cercana al corazón
            speed: 0.005 + Math.random() * 0.01,
            yOff: (Math.random() - 0.5) * 6
        });
    }

    // 6. ANIMACIÓN
    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        heart.rotation.y += 0.02;
        heart.position.y = Math.sin(time * 2) * 0.2;
        stars.rotation.y += 0.001;

        if(shootActive) {
            shootStar.position.x += 0.3;
            shootStar.position.y -= 0.15;
            shootStar.material.opacity = Math.sin(time * 20);
        } else {
            shootStar.position.set(100, 100, 100);
        }

        const w2 = window.innerWidth / 2;
        const h2 = window.innerHeight / 2;

        particles.forEach(p => {
            p.angle += p.speed;
            const x = Math.cos(p.angle) * p.radius;
            const z = Math.sin(p.angle) * p.radius;
            const y = p.yOff + Math.sin(p.angle * 2) * 1;

            const vec = new THREE.Vector3(x, y, z);
            vec.project(camera);

            p.el.style.transform = `translate(-50%, -50%) translate3d(${vec.x * w2 + w2}px, ${-(vec.y * h2) + h2}px, 0)`;
            p.el.style.fontSize = `${12 + (z + 10) * 0.4}px`;
            p.el.style.opacity = (z + 15) / 25;
            p.el.style.color = Math.sin(time * 3 + p.angle) > 0 ? "#ffffff" : "#ff69b4";
        });

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
