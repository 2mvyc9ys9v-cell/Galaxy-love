<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Amor Infinito</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05000a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        .text-particle {
            position: absolute;
            white-space: nowrap;
            font-weight: 600;
            pointer-events: none;
            transition: color 1.5s ease-in-out;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<script>
    // --- ESCENA Y CÁMARA ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 20;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // --- ESTRELLAS TITILANTES ---
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 2000;
    const starPositions = new Float32Array(starCount * 3);
    const starSizes = new Float32Array(starCount);

    for (let i = 0; i < starCount; i++) {
        starPositions[i * 3] = (Math.random() - 0.5) * 150;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 150;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 150;
        starSizes[i] = Math.random();
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeometry.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

    const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.2,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
    });
    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    // --- ESTRELLA FUGAZ ---
    const shootingStarGeo = new THREE.BufferGeometry();
    const shootingStarPos = new Float32Array(3);
    shootingStarGeo.setAttribute('position', new THREE.BufferAttribute(shootingStarPos, 3));
    const shootingStarMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true });
    const shootingStar = new THREE.Points(shootingStarGeo, shootingStarMat);
    scene.add(shootingStar);

    let isShooting = false;
    let shootVel = new THREE.Vector3();

    function triggerShootingStar() {
        isShooting = true;
        shootingStar.position.set((Math.random() - 0.5) * 40, 20, (Math.random() - 0.5) * 20);
        shootVel.set((Math.random() - 0.5) * 0.5, -0.5, (Math.random() - 0.5) * 0.2);
        setTimeout(() => { isShooting = false; }, 2000);
    }
    setInterval(() => { if(!isShooting) triggerShootingStar(); }, 4000);

    // --- CORAZÓN 3D ---
    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, 0);
    heartShape.bezierCurveTo(0, -0.3, -0.6, -0.3, -0.6, 0);
    heartShape.bezierCurveTo(-0.6, 0.6, 0, 1, 0, 1.4);
    heartShape.bezierCurveTo(0, 1, 0.6, 0.6, 0.6, 0);
    heartShape.bezierCurveTo(0.6, -0.3, 0, -0.3, 0, 0);

    const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.4, bevelEnabled: true, bevelSize: 0.2, bevelThickness: 0.2 });
    heartGeo.center();
    const heartMat = new THREE.MeshPhongMaterial({ color: 0xff1493, shininess: 100 });
    const heart = new THREE.Mesh(heartGeo, heartMat);
    heart.rotation.x = Math.PI;
    scene.add(heart);

    const light = new THREE.PointLight(0xff69b4, 2, 50);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // --- PALABRAS EN ÓRBITA ---
    const phrases = ["amor", "mi vida", "te amo", "una vida entera contigo", "me quedaría contigo mil años", "princesas", "mis amores", "Clarissa", "Victoria", "preciosas"];
    const textParticles = [];

    phrases.forEach((txt, i) => {
        const el = document.createElement('div');
        el.className = 'text-particle';
        el.innerText = txt;
        container.appendChild(el);

        textParticles.push({
            element: el,
            angle: (i / phrases.length) * Math.PI * 2,
            radius: 8 + Math.random() * 5,
            speed: 0.005 + Math.random() * 0.005,
            yOff: (Math.random() - 0.5) * 8,
            phase: Math.random() * Math.PI
        });
    });

    // --- ANIMACIÓN ---
    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        // Movimiento Corazón
        heart.rotation.y += 0.015;
        heart.position.y = Math.sin(time) * 0.2;

        // Estrella Fugaz
        if(isShooting) {
            shootingStar.position.add(shootVel);
            shootingStar.material.opacity = Math.sin(time * 10);
        } else {
            shootingStar.position.y = 100;
        }

        // Estrellas titilantes
        starField.rotation.y += 0.0005;
        starMaterial.opacity = 0.5 + Math.sin(time * 2) * 0.3;

        // Actualizar Palabras
        const widthHalf = window.innerWidth / 2;
        const heightHalf = window.innerHeight / 2;

        textParticles.forEach(p => {
            p.angle += p.speed;
            const x = Math.cos(p.angle) * p.radius;
            const z = Math.sin(p.angle) * p.radius;
            const y = p.yOff + Math.sin(p.angle * 2) * 2;

            const vector = new THREE.Vector3(x, y, z);
            vector.project(camera);

            const sx = (vector.x * widthHalf) + widthHalf;
            const sy = -(vector.y * heightHalf) + heightHalf;

            p.element.style.transform = `translate(-50%, -50%) translate3d(${sx}px, ${sy}px, 0)`;
            p.element.style.fontSize = `${14 + (z + 10) * 0.5}px`;
            p.element.style.opacity = (z + 15) / 25;

            // Cambio de color rosa/blanco
            const colorVal = Math.sin(time + p.phase);
            p.element.style.color = colorVal > 0 ? "#ffffff" : "#ff69b4";
        });

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
